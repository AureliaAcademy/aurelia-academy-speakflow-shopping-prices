function confirmSub(){const[a,t]=prog();const m=document.createElement('div');m.className='mod';m.innerHTML='<div class="card"><h3 style="margin-top:0">Submit your test?</h3><p>'+(t-a>0?'You have <b>'+(t-a)+'</b> unanswered item(s) or part(s). ':'')+'You will not be able to change your answers after submitting.</p><div class="act"><button class="btn g" id="c1">Keep working</button><button class="btn" id="c2">Submit</button></div></div>';document.body.appendChild(m);$('#c1').onclick=()=>m.remove();$('#c2').onclick=()=>{m.remove();submit()}}
function submit(){if(S.t1)return;S.t1=new Date();clearInterval(S.tm);stopA();if(rc)try{rc.abort()}catch(e){}rc=null;S.pm.forEach(p=>{if(p.st===1)p.st=2});document.querySelectorAll('.mod').forEach(m=>m.remove());result()}
function fixTxt(it){if(!it.df)return'';const b=it.df.w.filter(x=>x.s==='bad').map(x=>x.d+(x.h?' (said “'+x.h+'”)':'')),m=it.df.w.filter(x=>x.s==='miss').map(x=>x.d);return[b.length?'Check: '+b.join(', '):'',m.length?'Missing: '+m.join(', '):'',it.df.ex.length?'Extra: '+it.df.ex.join(' '):''].filter(Boolean).join(' · ')}
function result(){
 document.body.classList.remove('tst');$('#bt').innerHTML='';hdr('r');
 const rows=[],prt=[];let g=0,max=0,tm=0,c=0,w=0,bl=0;const rev=new Set();
 P().forEach((p,pi)=>{const nm=p.t.split(' – ')[0],ps={g:0,m:0,n:0,r:0,l:0};
  if(p.crit){const it=IT(pi,'r');ps.n+=it.n;ps.r+=Math.max(0,it.n-1);ps.l+=it.ls;
   p.crit.forEach((k,j)=>{const x=it.cr&&it.cr[j],hh=it.n?it.h.slice(0,90)+(it.h.length>90?'…':''):'—';
    if(!aut(k)){tm++;rows.push([nm,k.l,hh,'Teacher review',it.ls,it.n,'Review','—']);return}
    max++;ps.m++;const o=x&&x.s===1;if(o){g++;ps.g++;c++}else{it.n?w++:bl++;rev.add(nm)}
    rows.push([nm,k.l,hh,k.re?'required content':'30–45 seconds',it.ls,it.n,o?'Correct':it.n?'Incorrect':'Blank',o?'':it.n?'Missing: '+k.l:'Not recorded'])})}
  else p.it.forEach((q,i)=>{const it=IT(pi,i);ps.n+=it.n;ps.r+=Math.max(0,it.n-1);ps.l+=it.ls;max+=p.pp;ps.m+=p.pp;const o=it.n&&it.ok;
   if(o){g+=p.pp;ps.g+=p.pp;c++}else{it.n?w++:bl++;rev.add(nm)}
   rows.push([nm+' · '+(i+1),q.p.replace(/\n/g,' '),it.h||'—',mdl(p,i),it.ls,it.n,o?'Correct':it.n?'Incorrect':'Blank',o?'':it.n?fixTxt(it):'Not recorded'])});
  const pm=S.pm[pi];prt.push([nm,ps.g+' / '+ps.m,fmt(pm.used)+' / '+fmt(p.T),ps.l,ps.n,ps.r])});
 const pc=max?g/max*100:0,used=ST[S.k].time-S.left,nm=esc(S.name),TN=prt.reduce((s,r)=>s+r[4],0),TRr=prt.reduce((s,r)=>s+r[5],0),TL=prt.reduce((s,r)=>s+r[3],0);
 const sym={Correct:'✓ Correct',Incorrect:'✗ Incorrect – record again',Blank:'— Blank – record again',Review:'◔ Teacher review'};
 $('#ck').textContent=fmt(used);$('#ck').title='Time used';
 $('#app').innerHTML='<section class="res"><div class="eb">'+ST[S.k].n+' · Results</div><h1 style="font-size:clamp(34px,5vw,56px)">'+nm+'</h1><div class="card score"><div class="ring" style="--p:'+pc.toFixed(1)+'"><div><span>'+g+'<small>out of '+max+'</small></span></div></div><div><div class="kp"><span>✓ Correct: <b>'+c+'</b></span><span>✗ Incorrect: <b>'+w+'</b></span><span>— Blank: <b>'+bl+'</b></span>'+(tm?'<span>◔ Teacher review: <b>'+tm+' pts</b></span>':'')+'</div><div class="kp"><span>🎙 Recordings: <b>'+TN+'</b></span><span>🔁 Re-records: <b>'+TRr+'</b></span><span>🎧 Listens: <b>'+TL+'</b></span></div><p>Started: '+dt(S.t0)+'<br>Submitted: '+dt(S.t1)+'<br>Time used: '+fmt(used)+'</p><p><b>Parts to review:</b> '+(rev.size?[...rev].join(', '):'None')+'</p></div></div>'+
 '<div class="act"><button class="btn" onclick="print()">Print / Save PDF report</button><button class="btn g" id="cp">Copy results</button><button class="btn g" onclick="location.reload()">Back to start</button></div>'+
 '<div class="tw"><table><thead><tr><th>Part</th><th>Score</th><th>Time used / allowed</th><th>Listens</th><th>Recordings</th><th>Re-records</th></tr></thead><tbody>'+prt.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+
 '<div class="tw"><table><thead><tr><th>Item</th><th>Prompt</th><th>Your answer</th><th>Model / accepted</th><th>Listens</th><th>Rec.</th><th>Status</th><th>Where to fix</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+r[4]+'</td><td>'+r[5]+(r[5]>1?' <small>('+(r[5]-1)+' re)</small>':'')+'</td><td class="st-'+r[6]+'">'+sym[r[6]]+'</td><td>'+esc(r[7])+'</td></tr>').join('')+'</tbody></table></div></section>';
 $('#cp').onclick=()=>{const t='AURELIA ACADEMY – SpeakFlow A1 – Shopping & Prices – '+ST[S.k].n+'\nCandidate: '+S.name+'\nScore: '+g+' / '+max+'\nCorrect: '+c+' | Incorrect: '+w+' | Blank: '+bl+(tm?' | Teacher review: '+tm+' pts':'')+'\nRecordings: '+TN+' | Re-records: '+TRr+' | Listens: '+TL+'\nTime used: '+fmt(used)+'\nStarted: '+dt(S.t0)+'\nSubmitted: '+dt(S.t1)+'\nParts to review: '+([...rev].join(', ')||'None'),b=$('#cp');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}).finally(()=>{b.textContent='Copied ✓'})};
 scrollTo(0,0)}
document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
addEventListener('scroll',()=>$('#hd').classList.toggle('sc',scrollY>8),{passive:true});
home();
